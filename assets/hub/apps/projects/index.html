document.addEventListener('click', e => {

/* ---------- backup ---------- */
function backupData(cid) {
  if (!cid) { const {name, clients, projects, links, templates, set} = S; return {name, clients, projects, links, templates, set}; }
  const projects = S.projects.filter(p => p.client === cid), pids = new Set(projects.map(p => p.id));
  return {name: S.name, clients: S.clients.filter(c => c.id === cid), projects, links: S.links.filter(l => l.client === cid || pids.has(l.pid)), templates: S.templates, people: S.people, set: S.set};
}
async function doSave(cid) {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (!needCrypto()) return; if (!S.projects.length && !S.clients.length) return toast('Nothing to back up yet.', null, null, true);
  if (!sessionPw) { const pw = await askPassword(true); if (!pw) return; sessionPw = pw; }
  const date = todayS(), scoped = typeof cid === 'string' && cid, n2 = scoped ? 1 : (S.exp.date === date ? S.exp.n + 1 : 1);
  let text; try { text = await encrypt({app: 'cuech4-projects', v: 1, ...backupData(scoped), exportedAt: new Date().toISOString(), date, version: n2, scope: scoped ? 'client' : 'all'}, sessionPw); } catch (e) { return toast('Couldn’t encrypt the backup in this browser.', null, null, true); }
  const fname = safeName(scoped ? S.name + '_' + clientName(cid) : S.name) + '_' + date + (n2 > 1 ? '_v' + n2 : '') + '.txt';
  download(fname, text);
  if (!scoped) { S.exp = {date, n: n2}; S.dirty = false; S.lastBackup = date; saveNow(); chip(); }
  toast('Backup downloaded: ' + fname);
}
const exportClient = cid => doSave(cid);
const lastAct = p => [p.created ? dstr(new Date(p.created)) : '', ...p.log.map(l => l.date), ...p.notes.map(n => dstr(new Date(n.ts))), ...p.routes.map(r => r.date), p.closed || ''].reduce((m, x) => x > m ? x : m, '');
async function openBackup(obj) {
  if (!needCrypto()) return;
  let err = '', data = null, pw = null;
  while (!data) { pw = await askPassword(false, err); if (!pw) return; try { data = await decrypt(obj, pw); } catch (e) { err = 'Wrong password, or the file was changed.'; } }
  const inc = clean(data); if (!inc || (!inc.projects.length && !inc.clients.length)) return toast('The backup opened but has no projects in it.', null, null, true);
  let mode = 'replace';
  if (S.projects.length || S.clients.length) { const r = await modal({title: 'Open this backup', text: `It has ${inc.projects.length} project${inc.projects.length === 1 ? '' : 's'} for ${inc.clients.length} client${inc.clients.length === 1 ? '' : 's'}. Merge adds whatever is missing here (a project that exists in both keeps the copy with the latest activity). Replace swaps everything here for the backup.`, buttons: [{label: 'Cancel', value: 'cancel'}, {label: 'Replace', value: 'replace'}, {label: 'Merge', value: 'merge', primary: true}]}); if (r.value === 'cancel') return; mode = r.value; }
  if (mode === 'replace') { S = {...inc, exp: {date: String(data.date || ''), n: Number.isFinite(data.version) && data.scope !== 'client' ? data.version : 0}, dirty: false, lastBackup: DATE_RE.test(data.date) ? data.date : ''}; }
  else {
    const map = {}; inc.clients.forEach(c => { const ex = S.clients.find(x => x.id === c.id) || S.clients.find(x => x.name.toLowerCase() === c.name.toLowerCase()); if (ex) map[c.id] = ex.id; else { S.clients.push(c); map[c.id] = c.id; } });
    S.set.depts.push(...inc.set.depts.filter(d => !S.set.depts.includes(d)));
    const pm = {}; inc.people.forEach(x => { pm[x.id] = findOrAdd(S.people, x.name, x.dept).id; });
    inc.projects.forEach(p => { Object.keys(p.crew || {}).forEach(k => { p.crew[k] = [...new Set(p.crew[k].map(id => pm[id] || id))]; }); });
    inc.projects.forEach(p => { p.client = map[p.client] || p.client; const i = S.projects.findIndex(x => x.id === p.id); if (i < 0) S.projects.push(p); else if (lastAct(p) > lastAct(S.projects[i])) S.projects[i] = p; });
    inc.links.forEach(l => { l.client = map[l.client] || l.client; if (!S.links.some(x => x.id === l.id)) S.links.push(l); });
    inc.templates.forEach(t => { if (!S.templates.some(x => x.id === t.id)) S.templates.push(t); });
    S.dirty = true;
  }
  sessionPw = pw; ui.client = 'all'; ui.view = 'home'; saveNow(); render(); toast(mode === 'merge' ? 'Merged the backup into your projects' : 'Opened ' + S.name);
}
async function openFile(files) {
  files = [...files].filter(Boolean); if (!files.length) return;
  for (const file of files) { const text = await file.text(); let obj; try { obj = JSON.parse(text); } catch (e) {}
    if (obj && obj.app === 'cuech4-projects' && obj.salt && obj.iv && obj.data) await openBackup(obj); else toast('That file isn’t a Project Control backup.', null, null, true); }
}
$('#btnSave').onclick = () => doSave(); $('#btnOpen').onclick = () => $('#file').click(); $('#btnSet').onclick = () => openSettings();

$('#btnPw').onclick = async () => { if (!needCrypto()) return; const pw = await askPassword(true); if (pw) { sessionPw = pw; chip(); toast('Password set. Your next backup will use it.'); } };
$('#hname').addEventListener('change', e => { S.name = e.target.value.trim().slice(0, 60) || 'My Projects'; e.target.value = S.name; touch(); chip(); });

    const r = await modal({title: 'Start a new workspace?', text: S.dirty ? 'You have changes that aren’t in a backup yet. Starting new clears this browser’s copy.' : 'Your latest backup has everything. Starting new clears this browser’s copy.', buttons: btns});

};

(async () => {
  const st = await store.load(); const c = clean(st); if (c && st) S = c;
  render();
  window.__projects = {get S() { return S; }, get ui() { return ui; }, render, ACT, ready: true, reschedule, statusTable, buildBrief, sheetLine, mdLite, backupData, openBackup, parsePred, detailsText, clean, crewRows, crewSheet};
