<body>
<header class="app">
  <div><h1 class="title">📝 Notes</h1><a class="hub-breadcrumb" href="../../hub.html#latest-builds">← Cuech4 Hub</a></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const p2 = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const dstr = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const todayS = () => dstr(new Date());
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const shortD = s => { const d = new Date(s + 'T00:00:00'); return MON[d.getMonth()] + ' ' + d.getDate(); };
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const str = (v, n) => String(v == null ? '' : v).replace(/\r\n?/g, '\n').trim().slice(0, n);
const int = (v, d = 0) => Number.isFinite(+v) && v !== '' && v !== null ? Math.round(+v) : d;
const DAY = 864e5, TRASH_DAYS = 30, EMPTY = '<div><br></div>';
const fmtT = ts => { const d = new Date(ts), h = d.getHours(); return ((h + 11) % 12 + 1) + ':' + p2(d.getMinutes()) + ' ' + (h < 12 ? 'AM' : 'PM'); };
const fmtLong = ts => { const d = new Date(ts); return MONL[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + ' at ' + fmtT(ts); };
const sod = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return +d; };
function dateShort(ts) { const k = Math.round((sod(Date.now()) - sod(ts)) / DAY), d = new Date(ts); return k <= 0 ? fmtT(ts) : k === 1 ? 'Yesterday' : k < 7 ? DOW[d.getDay()] : (d.getMonth() + 1) + '/' + d.getDate() + '/' + String(d.getFullYear()).slice(2); }
function secOf(ts) { const k = Math.round((sod(Date.now()) - sod(ts)) / DAY), d = new Date(ts), y = new Date().getFullYear(); return k <= 0 ? 'Today' : k === 1 ? 'Yesterday' : k < 7 ? 'Previous 7 Days' : k < 30 ? 'Previous 30 Days' : d.getFullYear() === y ? MONL[d.getMonth()] : String(d.getFullYear()); }

/* ---------- storage ---------- */

const OK_TAGS = new Set(['div', 'p', 'br', 'b', 'strong', 'i', 'em', 'u', 's', 'strike', 'del', 'h1', 'h2', 'h3', 'ul', 'ol', 'li', 'a', 'blockquote', 'pre', 'code', 'hr', 'img', 'table', 'thead', 'tbody', 'tr', 'td', 'th', 'sub', 'sup']);

function sanitize(html) {
  const doc = new DOMParser().parseFromString('<body>' + String(html == null ? '' : html) + '</body>', 'text/html');
  const walk = (src, dst) => {
    src.childNodes.forEach(n => {
      if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.textContent)); return; }
      if (n.nodeType !== 1) return;
      const t = n.tagName.toLowerCase();
      if (DROP_TAGS.has(t)) return;
      if (!OK_TAGS.has(t)) { walk(n, dst); return; }
      const e = document.createElement(t === 'strong' ? 'b' : t === 'em' ? 'i' : t === 'strike' || t === 'del' ? 's' : t);
      if (t === 'a') { const h = n.getAttribute('href') || ''; if (/^(https?:|mailto:)/i.test(h.trim())) { e.setAttribute('href', h.trim()); e.setAttribute('target', '_blank'); e.setAttribute('rel', 'noopener noreferrer'); } }

      else if (t === 'li' && n.classList.contains('done')) e.className = 'done';

}

}

function toMd(html) {

    if (c.nodeType === 3) return c.textContent.replace(/ /g, ' ');

    if (t === 'code') return '`' + k + '`'; if (t === 'br') return '\n'; if (t === 'a') return '[' + k + '](' + c.getAttribute('href') + ')'; if (t === 'img') return '![image]()'; return k;
  };

    const ord = ul.tagName === 'OL', ck = ul.classList.contains('ck'); let i = 1;
    [...ul.children].forEach(li => {

    if (c.nodeType === 3) { if (c.textContent.trim()) out.push(c.textContent.trim(), ''); return; } if (c.nodeType !== 1) return;

}

    const li = e.target.closest('li'); if (li && li.parentElement.classList.contains('ck') && !(n && n.del) && e.target === li) { const r = li.getBoundingClientRect(); if (e.clientX - r.left < 28 && e.clientY - r.top < 30) { li.classList.toggle('done'); onEdit(); } }
  });
  pe.addEventListener('paste', e => {
    if (e.target.id !== 'ed' || (cur() && cur().del)) return; const cd = e.clipboardData, f = [...(cd.files || [])].find(x => /^image\//.test(x.type));
    if (f) { e.preventDefault(); insertImage(f); return; }
    const h = cd.getData('text/html'); if (h) { e.preventDefault(); exec('insertHTML', sanitize(h)); onEdit(); }
  });
  pe.addEventListener('drop', e => { const f = e.dataTransfer && [...e.dataTransfer.files].find(x => /^image\//.test(x.type)); if (e.target.closest('#ed') && f) { e.preventDefault(); e.stopPropagation(); insertImage(f); } });
  pe.addEventListener('mousedown', e => { if (e.target.closest('.tbn,.tbt button')) e.preventDefault(); });
  pe.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { e.stopPropagation(); command(b.dataset.c, b); } });
  pe.addEventListener('focusout', e => { if (e.target.id === 'ed') { const n = cur(); if (n && !n.del) { n.html = e.target.innerHTML; derive(n); queueSave(); } } });
}
function placeCaret(el) { const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

/* ---------- note actions ---------- */
function exportPop(anchor) {
  const n = cur(); if (!n) return;
  pop(anchor, 'Export', api => {
    api.body.innerHTML = '<button class="mi" data-k="md">Markdown (.md)</button><button class="mi" data-k="txt">Plain text (.txt)</button><button class="mi" data-k="print">🖨 Print / save as PDF</button>';
    api.body.onclick = e => { const k = ((e.target.closest('.mi') || {}).dataset || {}).k; if (!k) return; closePop(); const nm = safeName(n.t);
      if (k === 'md') { download(nm + '.md', toMd(n.html), 'text/markdown'); toast('Exported ' + nm + '.md' + (/<img/i.test(n.html) ? ' (images are not included)' : '')); }
      else if (k === 'txt') { download(nm + '.txt', plain(n.html).trim() + '\n'); toast('Exported ' + nm + '.txt'); }
      else window.print(); };
  });
}
async function moveDlg() {
  const n = cur(); if (!n) return;
  const r = await modal({title: 'Move note', fields: [{id: 'f', label: 'Folder', type: 'select', options: S.folders.map(f => [f.id, f.name]), value: n.folder}], buttons: [{label: 'Cancel', value: 'cancel'}, {label: 'Move', value: 'ok', primary: true}]});
  if (r.value !== 'ok' || r.vals.f === n.folder) return; n.folder = r.vals.f; touch(); render(); updFooter();
  if (curF !== 'all' && curF !== n.folder) { curN = null; loadEditor(); if (mobile()) setView('list'); selectFirst(); }
}
function deleteNote() {
  const n = cur(); if (!n) return; const v = visible(), i = v.indexOf(n), next = v[i + 1] || v[i - 1];
  n.del = Date.now(); n.pin = false; touch(); curN = null; renderFolders();
  if (mobile()) { setView('list'); loadEditor(); renderList(); } else { if (next) openNote(next.id); else { loadEditor(); renderList(); } }
  toast('Note moved to Recently Deleted', 'Undo', () => { n.del = 0; touch(); render(); openNote(n.id); });
}
async function purgeNote() {
  const n = cur(); if (!n) return; const r = await modal({title: 'Delete permanently?', text: 'This note will be erased and can’t be recovered.', buttons: [{label: 'Cancel', value: 'cancel'}, {label: 'Delete', value: 'ok', primary: true}]});
  if (r.value !== 'ok') return; S.notes.splice(S.notes.indexOf(n), 1); curN = null; touch(); render(); loadEditor(); if (mobile()) setView('list'); else selectFirst();
}

/* ---------- pane events ---------- */
$('#pF').addEventListener('click', e => {
  const a = e.target.closest('[data-a]');
  if (a && a.dataset.a === 'nf') return newFolder();
  if (a && a.dataset.a === 'fmenu') { e.stopPropagation(); return folderMenu(a, a.closest('.fi').dataset.f); }
  const f = e.target.closest('.fi'); if (f) goFolder(f.dataset.f);
});
$('#pF').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.a === 'fmenu') { e.preventDefault(); e.target.click(); } });
$('#pL').addEventListener('click', e => {
  const a = e.target.closest('[data-a]'), k = a && a.dataset.a;
  if (k === 'new') return newNote(); if (k === 'sample') { S.notes.push(...sampleNotes()); touch(); render(); selectFirst(); return toast('Added 3 sample notes — edit or delete them freely.'); }
  if (k === 'lmenu') return listMenu(a); if (k === 'tofolders') { dropIfEmpty(); setView('folders'); return; }
  const ni = e.target.closest('.ni'); if (ni) openNote(ni.dataset.id);
});
$('#pL').addEventListener('input', e => { if (e.target.id === 'sq') { q = e.target.value; renderList(); } });
$('#pE').addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a) return; const k = a.dataset.a, n = cur();
  if (k === 'new') newNote();
  else if (k === 'toList') { dropIfEmpty(); setView('list'); renderList(); }
  else if (k === 'pin' && n) { n.pin = !n.pin; touch(); loadEditor(); renderList(); toast(n.pin ? 'Pinned to the top of the list' : 'Unpinned'); }
  else if (k === 'move') moveDlg();
  else if (k === 'share') exportPop(a);
  else if (k === 'del') deleteNote();
  else if (k === 'restore' && n) { n.del = 0; touch(); render(); loadEditor(); toast('Note restored to ' + folderOf(n.folder).name); }
  else if (k === 'purge') purgeNote();
});
$('#lb').onclick = () => { $('#lb').hidden = true; };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#lb').hidden) $('#lb').hidden = true; });
bindEditor();
function backupData() { const {name, folders, notes, set} = S; return {name, folders, notes, set}; }
async function doSave() {
  if (document.activeElement && document.activeElement.blur && document.activeElement.id !== 'ed') document.activeElement.blur();
  const n = cur(); if (n && !n.del && edEl()) { n.html = edEl().innerHTML; derive(n); }
  if (!needCrypto()) return; if (!S.notes.length) return toast('Nothing to back up yet.', null, null, true);
  if (!sessionPw) { const pw = await askPassword(true); if (!pw) return; sessionPw = pw; }
  const date = todayS(), n2 = S.exp.date === date ? S.exp.n + 1 : 1;
  let text; try { text = await encrypt({app: 'cuech4-notes', v: 1, ...backupData(), exportedAt: new Date().toISOString(), date, version: n2}, sessionPw); } catch (e) { return toast('Couldn’t encrypt the backup in this browser.', null, null, true); }
  const fname = safeName(S.name) + '_' + date + (n2 > 1 ? '_v' + n2 : '') + '.txt';
  download(fname, text); S.exp = {date, n: n2}; S.dirty = false; S.lastBackup = date; saveNow(); chip(); toast('Backup downloaded: ' + fname);
}
async function importText(file) {
  const text = await file.text(), md = /\.(md|markdown)$/i.test(file.name);
  let html = md ? mdToHtml(text) : textToHtml(text);
  const first = (plain(html).split('\n').map(s => s.trim()).filter(Boolean)[0] || '');
  const base = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
  if (base && !/^<h1>/i.test(html) && (!first || first.length > 80)) html = '<h1>' + esc(base) + '</h1>' + html;
  const n = mkNote(html, curF === 'all' || curF === 'trash' ? 'f0' : curF); S.notes.push(n); return n;
}
async function openFile(files) {
  files = [...files].filter(Boolean); if (!files.length) return; const made = [];
  for (const file of files) {
    const text = await file.text(); let obj; try { obj = JSON.parse(text); } catch (e) {}
    if (obj && obj.app === 'cuech4-notes' && obj.salt && obj.iv && obj.data) { await openBackup(obj); continue; }
    if (obj && typeof obj === 'object' && !/\.(txt|md|markdown)$/i.test(file.name)) { toast('That JSON file isn’t a Notes backup.', null, null, true); continue; }
    made.push(await importText(file));
  }
  if (made.length) { touch(); if (curF === 'trash') curF = 'all'; q = ''; render(); openNote(made[0].id); toast('Imported ' + made.length + ' note' + (made.length > 1 ? 's' : '')); }
}
async function openBackup(obj) {
  if (!needCrypto()) return;
  let err = '', data = null, pw = null;
  while (!data) { pw = await askPassword(false, err); if (!pw) return; try { data = await decrypt(obj, pw); } catch (e) { err = 'Wrong password, or the file was changed.'; } }
  const inc = clean(data); if (!inc || !inc.notes.length) return toast('The backup opened but has no notes in it.', null, null, true);
  let mode = 'replace';
  if (S.notes.length) { const r = await modal({title: 'Open this backup', text: `It has ${inc.notes.length} note${inc.notes.length > 1 ? 's' : ''} in ${inc.folders.length} folder${inc.folders.length > 1 ? 's' : ''}. Merge adds anything missing to what you have now (when a note exists in both, the most recently edited copy wins). Replace swaps your current notes for the backup.`, buttons: [{label: 'Cancel', value: 'cancel'}, {label: 'Replace', value: 'replace'}, {label: 'Merge', value: 'merge', primary: true}]}); if (r.value === 'cancel') return; mode = r.value; }
  dropIfEmpty();
  if (mode === 'replace') S = {...inc, exp: {date: String(data.date || ''), n: Number.isFinite(data.version) ? data.version : 0}, dirty: false, lastBackup: DATE_RE.test(data.date) ? data.date : ''};
  else {
    const fids = new Set(S.folders.map(f => f.id)); inc.folders.forEach(f => { if (!fids.has(f.id)) S.folders.push(f); });
    for (const n of inc.notes) { const m = S.notes.find(x => x.id === n.id); if (!m) S.notes.push(n); else if (n.mod > m.mod) Object.assign(m, n); }
    S.dirty = true;
  }
  sessionPw = pw; curN = null; curF = 'all'; q = ''; saveNow(); render(); loadEditor(); selectFirst(); toast(mode === 'merge' ? 'Merged the backup into your notes' : 'Opened ' + S.name);
}
$('#btnSave').onclick = doSave; $('#btnOpen').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = [...e.target.files]; e.target.value = ''; openFile(f); };
$('#btnPw').onclick = async () => { if (!needCrypto()) return; const pw = await askPassword(true); if (pw) { sessionPw = pw; chip(); toast('Password set. Your next backup will use it.'); } };
$('#hname').addEventListener('change', e => { S.name = e.target.value.trim().slice(0, 60) || 'My Notes'; e.target.value = S.name; touch(); chip(); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); const fs = [...(e.dataTransfer ? e.dataTransfer.files : [])].filter(f => /\.(txt|md|markdown|json)$/i.test(f.name)); if (fs.length) openFile(fs); });
$('#newBtn').onclick = async () => {
  if (S.notes.length) {
    const btns = S.dirty ? [{label: 'Cancel', value: 'cancel'}, {label: 'Discard & start new', value: 'discard'}, {label: 'Backup first', value: 'save', primary: true}] : [{label: 'Cancel', value: 'cancel'}, {label: 'Start new', value: 'discard', primary: true}];
    const r = await modal({title: 'Start a new notebook?', text: S.dirty ? 'You have changes that aren’t in a backup yet. Starting new clears this browser’s copy.' : 'Your latest backup has everything. Starting new clears this browser’s copy.', buttons: btns});
    if (r.value === 'cancel') return; if (r.value === 'save') { await doSave(); if (S.dirty) return; }
  }
  S = fresh(); sessionPw = null; curN = null; curF = 'all'; q = ''; saveNow(); render(); loadEditor(); setView('list');
};
$('#app').addEventListener('keydown', e => { if (e.key === 'Escape' && document.activeElement && document.activeElement.id === 'sq') { q = ''; renderList(); } });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); newNote(); } });

/* ---------- boot ---------- */
(async () => {
  const st = await store.load(); const c = clean(st); if (c && st) S = c;
  $('#hname').value = S.name; render(); loadEditor(); selectFirst();
  window.__notes = {get S() { return S; }, get cur() { return cur(); }, get curF() { return curF; }, ready: true, sanitize, toMd, mdToHtml, plain};
})();
})();
</script>
