<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diary — Cuech4 Hub</title>
<link rel="icon" type="image/svg+xml" href="assets/diary-icon.svg">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b13; --panel: #13131f; --panel-2: #0e0e18; --line: #272740;
    --text: #ececf6; --muted: #9696b4;
    --accent: #6366f1; --accent-2: #818cf8; --accent-text: #c7d2fe;
    --ok: #34d399;
    --paper: #fbf5e6; --ink: #2b2a33;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: radial-gradient(1200px 600px at 60% -10%, #1a1a33 0%, var(--bg) 60%); color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif; line-height: 1.45; min-height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--line); background: rgba(14,14,24,.8); backdrop-filter: blur(6px); }
  .title { font-size: 20px; font-weight: 700; background: linear-gradient(90deg, var(--accent-2), #c4b5fd 55%, #f9a8d4); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0; }
  .hub-breadcrumb { color: var(--muted); font-size: 13px; text-decoration: none; }
  .hub-breadcrumb:hover { color: var(--accent-text); }
  button { font-family: inherit; }
  .btn-ghost { background: #15152a; border: 1px solid var(--line); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn-ghost:hover { border-color: var(--accent-2); }
  .btn-main { background: linear-gradient(180deg, #818cf8, #6366f1); border: 0; color: #fff; font-weight: 600; font-size: 14px; padding: 9px 18px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 22px rgba(99,102,241,.3); }
  .btn-main:hover { filter: brightness(1.08); }
  .ribbon { font-size: 12px; font-weight: 600; color: #fde68a; border: 1px solid rgba(253,230,138,.3); background: rgba(253,230,138,.08); border-radius: 999px; padding: 3px 12px; }

  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 24px 0; max-width: 1380px; margin: 0 auto; }
  .top .sp { flex: 1; }
  .chip { font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 4px 12px; border: 1px solid rgba(52,211,153,.3); color: var(--ok); background: rgba(52,211,153,.07); white-space: nowrap; }

  .app { display: grid; grid-template-columns: 270px 1fr; gap: 22px; max-width: 1380px; margin: 0 auto; padding: 16px 24px 60px; align-items: start; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .search { width: 100%; height: 38px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; color: var(--text); padding: 0 12px; font: 14px inherit; font-family: inherit; }
  .search:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
  .cal-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
  .cal-h button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; padding: 2px 8px; border-radius: 6px; }
  .cal-h button:hover { color: var(--text); background: #1c1c33; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; font-size: 12px; }
  .cal .dn { color: var(--muted); font-size: 11px; padding-bottom: 4px; }
  .cal button { aspect-ratio: 1; border: 0; background: transparent; color: var(--text); border-radius: 8px; font-size: 12px; cursor: pointer; padding: 0; position: relative; display: grid; place-items: center; line-height: 1; }
  .cal button:hover { background: #1c1c33; }
  .cal button.has { background: rgba(99,102,241,.14); }
  .cal button.has span { font-size: 14px; }
  .cal button.cur { box-shadow: inset 0 0 0 1.5px var(--accent-2); }
  .cal button.dim { color: #4a4a68; cursor: default; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .stat small { color: var(--muted); font-size: 12px; }
  .moods { display: flex; gap: 4px; align-items: end; height: 56px; }
  .moods div { flex: 1; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--accent-2), var(--accent)); opacity: .85; position: relative; }
  .mlab { display: flex; justify-content: space-between; font-size: 14px; margin-top: 6px; }

  .stage { min-width: 0; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; position: relative; }
  .tools .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  .tools label { font-size: 12.5px; color: var(--muted); }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .sw.on { border-color: var(--accent-2); box-shadow: 0 0 0 2px #0b0b13 inset, 0 0 0 1px var(--accent-2); }
  select.mini { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; height: 32px; padding: 0 8px; font: 13px inherit; font-family: inherit; }
  .tb { background: transparent; border: 1px solid transparent; color: var(--text); height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .tb:hover { background: #1c1c33; border-color: var(--line); }
  .pop { position: absolute; top: 52px; left: 14px; z-index: 20; background: #181830; border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; box-shadow: 0 14px 40px rgba(0,0,0,.5); width: 320px; }
  .pop button { background: none; border: 0; font-size: 22px; padding: 4px; border-radius: 8px; cursor: pointer; }
  .pop button:hover { background: #26264a; }

  .bookwrap { position: relative; padding: 0 34px; perspective: 2200px; }
  .book { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: #2a1d3a; border-radius: 18px; padding: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px #3b2c52; }
  .book::before { content: ""; position: absolute; left: 50%; top: 14px; bottom: 14px; width: 40px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, rgba(0,0,0,.28) 45%, rgba(0,0,0,.4) 50%, rgba(0,0,0,.28) 55%, transparent); z-index: 4; pointer-events: none; }
  .page { position: relative; min-height: 600px; background: var(--pc, var(--paper)); color: var(--ink); padding: 26px 30px 22px 30px; display: flex; flex-direction: column; transition: background .25s; }
  .page.l { border-radius: 10px 0 0 10px; padding-right: 40px; box-shadow: inset -18px 0 24px -18px rgba(0,0,0,.25); }
  .page.r { border-radius: 0 10px 10px 0; padding-left: 40px; box-shadow: inset 18px 0 24px -18px rgba(0,0,0,.25); }
  .page.act::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px rgba(99,102,241,.55); pointer-events: none; }
  .ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .dow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: rgba(43,42,51,.55); font-weight: 700; }
  .dnum { font-size: 40px; font-weight: 700; line-height: 1; margin-top: 2px; }
  .dnum small { font-size: 15px; font-weight: 500; color: rgba(43,42,51,.6); margin-left: 6px; }
  .mood { display: flex; gap: 2px; }
  .mood button { background: none; border: 0; font-size: 20px; padding: 2px 3px; border-radius: 8px; cursor: pointer; opacity: .35; filter: grayscale(.6); transition: transform .12s, opacity .12s; }
  .mood button:hover { opacity: .8; }
  .mood button.on { opacity: 1; filter: none; transform: scale(1.35); background: rgba(255,255,255,.55); }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 6px; font-size: 12.5px; }
  .meta span { background: rgba(43,42,51,.07); border-radius: 999px; padding: 2px 10px; }
  .meta .t1 { background: rgba(99,102,241,.16); color: #3f3fa8; }
  .meta .t2 { background: rgba(219,39,119,.14); color: #a3175c; }
  .meta .t3 { background: rgba(5,150,105,.15); color: #046b4c; }
  .ttl { border: 0; background: transparent; font: 700 22px/1.3 var(--ff); font-family: var(--ff); color: var(--ink); width: 100%; padding: 6px 0; outline: none; border-bottom: 2px solid rgba(43,42,51,.12); }
  .ttl::placeholder { color: rgba(43,42,51,.35); }
  .body { flex: 1; width: 100%; resize: none; border: 0; outline: none; background-color: transparent; color: var(--ink); font: 15px/32px var(--ff); font-family: var(--ff); padding: 0; margin-top: 4px;
    background-image: repeating-linear-gradient(transparent 0 31px, rgba(43,42,51,.11) 31px 32px); background-attachment: local; min-height: 320px; }
  .body::placeholder { color: rgba(43,42,51,.35); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: rgba(43,42,51,.55); }
  .stk { position: absolute; font-size: 34px; transform: rotate(var(--r, -8deg)); filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); user-select: none; cursor: grab; }
  .tape { position: absolute; top: -10px; left: 50%; width: 90px; height: 22px; background: rgba(250, 204, 21, .55); transform: translateX(-50%) rotate(-2deg); box-shadow: 0 1px 3px rgba(0,0,0,.2); z-index: 3; }
  .leaf { position: absolute; top: 14px; bottom: 14px; width: calc(50% - 14px); z-index: 8; background: var(--lc, var(--paper)); backface-visibility: visible; box-shadow: 0 0 40px rgba(0,0,0,.35); pointer-events: none; }
  .leaf.r { left: 50%; transform-origin: left center; border-radius: 0 10px 10px 0; }
  .leaf.l { right: 50%; transform-origin: right center; border-radius: 10px 0 0 10px; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 64px; border-radius: 10px; border: 1px solid var(--line); background: #15152a; color: var(--text); font-size: 20px; cursor: pointer; z-index: 10; }
  .nav:hover { border-color: var(--accent-2); color: var(--accent-text); }
  .nav.p { left: 0; } .nav.n { right: 0; }
  .nav:disabled { opacity: .3; cursor: default; }
  .tabs { position: absolute; right: 8px; top: 60px; display: flex; flex-direction: column; gap: 6px; z-index: 9; }
  .tabs button { writing-mode: vertical-rl; border: 0; font-size: 12px; font-weight: 700; padding: 10px 5px; border-radius: 0 8px 8px 0; cursor: pointer; color: #1b1b2e; }
  .pager { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; }
  .pager kbd { background: #15152a; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: 11.5px; color: var(--text); }
  .note { margin: 18px auto 0; max-width: 820px; color: var(--muted); font-size: 13px; text-align: center; }

  @media (max-width: 1000px) {
    .app { grid-template-columns: 1fr; padding: 12px 12px 50px; }
    .side { order: 2; }
    .top { padding: 12px 12px 0; }
    header { padding: 12px 16px; }
    .bookwrap { padding: 0 28px; }
    .book { grid-template-columns: 1fr; }
    .book::before { display: none; }
    .page.r { display: none; }
    .page.l { border-radius: 10px; padding-right: 30px; box-shadow: none; }
    .leaf { width: calc(100% - 28px); }
    .tabs { display: none; }
    .ribbon { display: none; }
  }

  /* ---- additions for the working diary ---- */
  #dname { font: 700 18px/1.2 inherit; font-family: inherit; color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; min-width: 200px; flex: 0 1 300px; }
  #dname:hover { border-color: var(--line); }
  #dname:focus { outline: none; border-color: var(--accent-2); background: #0a0a14; }
  .chip.dirty { color: #fbbf24; border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.08); }
  .chip.idle { color: var(--muted); border-color: var(--line); background: transparent; }
  .results { display: flex; flex-direction: column; gap: 6px; max-height: 380px; overflow: auto; }
  .results button { text-align: left; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 10px; cursor: pointer; font: 13px/1.35 inherit; font-family: inherit; }
  .results button:hover { border-color: var(--accent-2); }
  .results small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .results mark { background: rgba(129,140,248,.35); color: var(--text); border-radius: 3px; }
  .meta button { background: rgba(43,42,51,.07); border: 0; border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12.5px; color: inherit; cursor: pointer; }
  .meta button:hover { background: rgba(43,42,51,.15); }
  .meta .t1 { background: rgba(99,102,241,.16); color: #3f3fa8; }
  .meta .t2 { background: rgba(219,39,119,.14); color: #a3175c; }
  .meta .t3 { background: rgba(5,150,105,.15); color: #046b4c; }
  .meta input { border: 1px solid rgba(43,42,51,.25); background: rgba(255,255,255,.7); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12.5px; width: 110px; outline: none; color: var(--ink); }
  .pics { display: flex; gap: 12px; margin: 8px 0 2px; flex-wrap: wrap; }
  .pic { position: relative; background: #fff; padding: 5px 5px 14px; box-shadow: 0 3px 8px rgba(0,0,0,.22); transform: rotate(var(--r, -1.5deg)); }
  .pic:nth-child(2) { --r: 2deg; } .pic:nth-child(3) { --r: -2.5deg; }
  .pic img { display: block; height: 120px; max-width: 200px; object-fit: cover; cursor: zoom-in; }
  .pic .x { position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: #1b1b2e; color: #fff; cursor: pointer; font-size: 14px; line-height: 1; opacity: 0; transition: opacity .12s; }
  .pic:hover .x, .pic .x:focus-visible { opacity: 1; }
  .stk { touch-action: none; }
  .fresh { margin: auto; text-align: center; color: rgba(43,42,51,.45); }
  .fresh .big { font-size: 54px; }
  .fresh button { margin-top: 10px; background: rgba(43,42,51,.08); border: 1px dashed rgba(43,42,51,.3); color: var(--ink); padding: 8px 14px; border-radius: 10px; cursor: pointer; font: 14px inherit; font-family: inherit; }
  .fresh button:hover { background: rgba(43,42,51,.14); }
  .hdate { font-size: 12px; color: rgba(43,42,51,.5); }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #1b1b36; border: 1px solid var(--line); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 14px; display: flex; gap: 14px; align-items: center; z-index: 60; box-shadow: 0 10px 40px rgba(0,0,0,.5); max-width: 92vw; }
  #toast.err { border-color: rgba(248,113,113,.5); }
  #toast button { background: transparent; border: 0; color: var(--accent-2); font-weight: 600; cursor: pointer; font-size: 14px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(440px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  dialog.lb { width: auto; max-width: 94vw; background: transparent; border: 0; }
  dialog.lb img { max-width: 92vw; max-height: 88vh; border-radius: 10px; display: block; cursor: zoom-out; }
  .dh { font-size: 17px; font-weight: 700; padding: 18px 22px 4px; }
  .db { padding: 6px 22px 4px; font-size: 14px; color: var(--muted); }
  .db p { margin: 6px 0 10px; }
  .db label { display: block; font-size: 13px; color: var(--text); margin: 10px 0 0; }
  .db input { display: block; width: 100%; margin-top: 6px; height: 42px; background: #0a0a14; border: 1px solid var(--line); border-radius: 10px; color: var(--text); padding: 0 12px; font: 15px inherit; font-family: inherit; }
  .db input:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
  .derr { color: #f87171; min-height: 18px; font-size: 13px; }
  .df { display: flex; justify-content: flex-end; gap: 10px; padding: 8px 22px 18px; flex-wrap: wrap; }
  .df .btn-main { padding: 9px 18px; }
  .foot2 { color: var(--muted); font-size: 12.5px; max-width: 900px; margin: 16px auto 0; text-align: center; }
  @media (max-width: 1000px) {
    .leaf.r { left: 14px; } .leaf.l { right: 14px; }
    .leaf { width: calc(100% - 28px); }
    #dname { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1 class="title">📔 My Diary</h1>
    <a href="../../hub.html#latest-builds" class="hub-breadcrumb">← Cuech4 Hub</a>
  </div>
  <button class="btn-ghost" id="newBtn">＋ New</button>
</header>

<div class="top">
  <input id="dname" placeholder="Diary name" maxlength="60" aria-label="Diary name" spellcheck="false">
  <span class="chip idle" id="chip" role="status"></span>
  <span class="sp"></span>
  <button class="btn-ghost" id="btnOpen">⬆ Open backup</button>
  <button class="btn-ghost" id="btnPw">🔑 <span id="pwLbl">Set password</span></button>
  <button class="btn-main" id="btnSave">⬇ Download backup</button>
</div>

<div class="app">
  <aside class="side">
    <input class="search" id="q" placeholder="🔍  Search your entries" aria-label="Search entries" autocomplete="off">
    <div class="card" id="results" hidden><h3 id="rT">Results</h3><div class="results" id="rList"></div></div>
    <div class="card" id="calCard">
      <div class="cal-h"><button id="cPrev" aria-label="Previous month">‹</button><span id="calT"></span><button id="cNext" aria-label="Next month">›</button></div>
      <div class="cal" id="cal"></div>
    </div>
    <div class="card">
      <h3>This month</h3>
      <div class="stats" id="stats"></div>
    </div>
    <div class="card">
      <h3>Mood this week</h3>
      <div class="moods" id="moods"></div>
      <div class="mlab" id="mlab"></div>
    </div>
  </aside>

  <section class="stage">
    <div class="tools">
      <label for="ff">Font</label>
      <select class="mini" id="ff"><option value="serif">Classic</option><option value="hand">Handwriting</option><option value="type">Typewriter</option></select>
      <span class="sep"></span>
      <label>Page</label>
      <span id="sws"></span>
      <span class="sep"></span>
      <button class="tb" id="wxBtn" title="Set the weather">🌤 Weather</button>
      <button class="tb" id="emBtn" title="Insert emoji in the text">😊 Emoji</button>
      <button class="tb" id="stBtn" title="Add a sticker to the page">⭐ Sticker</button>
      <button class="tb" id="phBtn" title="Add photos to the page">🖼 Photo</button>
      <button class="tb" id="todayBtn" title="Jump to today">📍 Today</button>
      <div class="pop" id="pop" hidden></div>
    </div>

    <div class="bookwrap">
      <button class="nav p" id="prev" aria-label="Previous pages">‹</button>
      <button class="nav n" id="next" aria-label="Next pages">›</button>
      <div class="tabs" id="tabs"></div>
      <div class="book" id="book">
        <div class="page l" id="pl"></div>
        <div class="page r" id="pr"></div>
      </div>
    </div>
    <div class="pager" id="pager"></div>
    <p class="foot2">Your diary autosaves in this browser (unencrypted, on this device only). The downloaded backup is a single <b>.txt</b>, encrypted with your password — keep the password safe, it can’t be recovered.</p>
  </section>
</div>

<div id="toast" hidden></div>
<dialog id="dlg"><div class="dh" id="dT"></div><div class="db" id="dB"></div><div class="df" id="dF"></div></dialog>
<dialog id="lb" class="lb"><img id="lbImg" alt="Photo"></dialog>
<input type="file" id="file" accept=".txt,text/plain" hidden>
<input type="file" id="photo" accept="image/*" multiple hidden>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const MOODS = ['😄', '🙂', '😐', '😔', '😡', '😴'];
const MN = ['Great', 'Good', 'Okay', 'Low', 'Angry', 'Tired'];
const SCORE = {'😄': 5, '🙂': 4, '😐': 3, '😴': 2.5, '😔': 2, '😡': 1.5};
const COLORS = {cream: '#fbf5e6', rose: '#fde7ea', mint: '#e2f5e8', sky: '#e1effb', lav: '#ebe5fa', butter: '#fdf1c0'};
const FONTS = {serif: "Georgia, 'Times New Roman', serif", hand: "'Bradley Hand','Segoe Print','Comic Sans MS','Marker Felt',cursive", type: "'Courier New', ui-monospace, monospace"};
const WX = ['☀️', '🌤️', '⛅', '☁️', '🌧️', '⛈️', '❄️', '🌫️', '💨', '🌈'];
const EMO = '😀😄😂🥹😍🥰😎🤔😴😔😢😡🤯🥳🙌👍💪🙏❤️💛💚💙💜🔥✨🌟🌈☀️🌧️☕🍕🌮🍰🎉🎶📚✏️🏃🚶🌱🌸🐶🐱🦊🎂🎁✈️🏖️🍿🎮'.match(/\p{Extended_Pictographic}️?/gu);

function sanitize(raw) {

    const n = (v, lo, hi, df) => Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : df;
    out[d] = {
      mood: MOODS.includes(e.mood) ? e.mood : null, color: COLORS[e.color] ? e.color : 'cream', weather: WX.includes(e.weather) ? e.weather : null,
      title: String(e.title || '').slice(0, 200), text: String(e.text || '').slice(0, 30000),
      tags: (Array.isArray(e.tags) ? e.tags : []).map(t => String(t).slice(0, 20)).filter(Boolean).slice(0, 6),

}

pop.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const x = b.textContent, d = activeDate(); if (!d) return;
  if (popMode === 'wx') { ensure(d).weather = x === '✖' ? null : x; touch(d); paint(); }
  else if (popMode === 'em') { const t = document.querySelector(`#${active === 'r' && !one ? 'pr' : 'pl'} .body`); if (t) { const s = t.selectionStart == null ? t.value.length : t.selectionStart; t.setRangeText(x, s, t.selectionEnd == null ? s : t.selectionEnd, 'end'); t.dispatchEvent(new Event('input', {bubbles: true})); t.focus(); } }
  else if (popMode === 'st') { const en = ensure(d); if (en.stickers.length >= 30) return toast('That page is full of stickers!', null, null, true); en.stickers.push({e: x, x: 62 + Math.random() * 26, y: 18 + Math.random() * 60, r: Math.round(Math.random() * 30 - 15)}); touch(d); paint(); }
  pop.hidden = true; popMode = '';
});
document.addEventListener('click', e => { if (!e.target.closest('.pop') && !e.target.closest('.tools') ) { pop.hidden = true; popMode = ''; } });

async function shrink(file) {
  const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'}), sc = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * sc)); c.height = Math.max(1, Math.round(bmp.height * sc));
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height); if (bmp.close) bmp.close();
  return c.toDataURL('image/jpeg', 0.8);
}
$('#phBtn').onclick = () => { const d = activeDate(); if (!d) return; if (ensure(d).photos.length >= 3) return toast('Up to 3 photos per page.', null, null, true); $('#photo').click(); };
$('#photo').onchange = async e => {
  const files = [...e.target.files]; e.target.value = ''; const d = activeDate(); if (!d || !files.length) return;
  const en = ensure(d); let added = 0, failed = 0;
  for (const f of files) { if (en.photos.length >= 3) break; try { en.photos.push(await shrink(f)); added++; } catch (err) { failed++; } }
  if (added) { touch(d); paint(); }
  if (failed) toast('Couldn’t read ' + failed + (failed === 1 ? ' photo' : ' photos') + ' (HEIC isn’t supported by browsers — use JPG or PNG).', null, null, true);
  else if (files.length > added) toast('Up to 3 photos per page.', null, null, true);
};

/* ---------- search ---------- */
$('#q').addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase(); const has = !!query;
  $('#results').hidden = !has; $('#calCard').hidden = has;
  if (!has) return;
  const hits = Object.entries(S.entries).filter(([, en]) => !isEmpty(en) && (en.title + ' ' + en.text + ' #' + en.tags.join(' #')).toLowerCase().includes(query)).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 40);
  $('#rT').textContent = hits.length + (hits.length === 1 ? ' result' : ' results');
  const hl = s => { const i = s.toLowerCase().indexOf(query); if (i < 0) return esc(s.slice(0, 90)); const a = Math.max(0, i - 30), b = Math.min(s.length, i + query.length + 50); return (a ? '…' : '') + esc(s.slice(a, i)) + '<mark>' + esc(s.slice(i, i + query.length)) + '</mark>' + esc(s.slice(i + query.length, b)) + (b < s.length ? '…' : ''); };
  $('#rList').innerHTML = hits.length ? hits.map(([d, en]) => { const f = fmtD(d); return `<button data-d="${d}">${en.mood || '📝'} ${f.monS} ${f.day}, ${f.yr}${en.title ? ' · ' + esc(en.title) : ''}<small>${hl(en.text || '#' + en.tags.join(' #'))}</small></button>`; }).join('') : '<p style="color:var(--muted);font-size:13px;margin:0">Nothing found.</p>';
});
$('#rList').addEventListener('click', e => { const b = e.target.closest('button'); if (b) goDate(b.dataset.d); });

/* ---------- encrypted backup ---------- */
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ITER = 250000;
async function deriveKey(pw, salt, iter) { const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, km, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']); }
async function encrypt(obj, pw) { const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), key = await deriveKey(pw, salt, ITER); const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)))); return JSON.stringify({app: 'cuech4-diary', format: 1, enc: 'AES-GCM-256', kdf: 'PBKDF2-SHA256', iter: ITER, salt: b64(salt), iv: b64(iv), data: b64(ct)}); }
async function decrypt(file, pw) { const key = await deriveKey(pw, unb64(file.salt), file.iter); return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(file.iv)}, key, unb64(file.data)))); }
const safeName = s => (s || 'My Diary').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').replace(/\s+/g, ' ').trim().replace(/ /g, '_').slice(0, 60) || 'My_Diary';
function needCrypto() { if (window.crypto && crypto.subtle) return true; toast('Encryption needs a secure page (https or a local file).', null, null, true); return false; }
async function askPassword(confirm, error) {
  const r = await modal({title: confirm ? 'Protect your backup' : 'Enter your password', text: confirm ? 'Your backup file is encrypted with this password. There’s no reset — if you lose it, the file can’t be opened.' : 'This backup is encrypted. Enter the password you used when you downloaded it.',
    fields: confirm ? [{id: 'p1', label: 'Password', type: 'password', ac: 'new-password'}, {id: 'p2', label: 'Confirm password', type: 'password', ac: 'new-password'}] : [{id: 'p1', label: 'Password', type: 'password', ac: 'current-password'}], error,
    validate: v => confirm ? (v.p1.length < 6 ? 'Use at least 6 characters.' : v.p1 !== v.p2 ? 'The passwords don’t match.' : '') : (v.p1 ? '' : 'Enter the password.'),
    buttons: [{label: 'Cancel', value: 'cancel'}, {label: confirm ? 'Encrypt & continue' : 'Open', value: 'ok', primary: true}]});
  return r.value === 'ok' ? r.vals.p1 : null;
}
async function doSave() {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (!needCrypto()) return;
  prune();
  if (!Object.values(S.entries).some(e => !isEmpty(e))) return toast('Write something first — your diary is empty.', null, null, true);
  if (!sessionPw) { const pw = await askPassword(true); if (!pw) return; sessionPw = pw; }
  const date = todayS(), n = S.exp.date === date ? S.exp.n + 1 : 1, ser = serialize();
  const payload = {app: 'cuech4-diary', v: 1, name: S.name, entries: ser.entries, font: S.font, exportedAt: new Date().toISOString(), date, version: n};
  let text; try { text = await encrypt(payload, sessionPw); } catch (e) { return toast('Couldn’t encrypt the backup in this browser.', null, null, true); }
  const fname = safeName(S.name) + '_' + date + (n > 1 ? '_v' + n : '') + '.txt';
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'})); a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  S.exp = {date, n}; S.dirty = false; S.lastBackup = date; saveNow(); chip();
  toast('Backup downloaded: ' + fname);
}
async function openFile(file) {
  if (!file || !needCrypto()) return;
  let obj; try { obj = JSON.parse(await file.text()); } catch (e) {}
  if (!obj || obj.app !== 'cuech4-diary' || !obj.data || !obj.salt || !obj.iv) return toast('That doesn’t look like a Diary backup.', null, null, true);
  let err = '', data = null, pw = null;
  while (!data) { pw = await askPassword(false, err); if (!pw) return; try { data = await decrypt(obj, pw); } catch (e) { err = 'Wrong password, or the file was changed.'; } }
  const inc = sanitize(data.entries), n = Object.keys(inc).length;
  if (!n) return toast('The backup opened but has no entries in it.', null, null, true);
  const have = Object.values(S.entries).some(e => !isEmpty(e)); let mode = 'replace';
  if (have) { const r = await modal({title: 'Open this backup', text: `It has ${n} ${n === 1 ? 'entry' : 'entries'}. Merge keeps both diaries, using the newest version of any day that exists in both. Replace swaps your current diary for the backup.`, buttons: [{label: 'Cancel', value: 'cancel'}, {label: 'Replace', value: 'replace'}, {label: 'Merge', value: 'merge', primary: true}]}); if (r.value === 'cancel') return; mode = r.value; }
  if (mode === 'replace') { S.entries = inc; S.name = String(data.name || 'My Diary').slice(0, 60); if (FONTS[data.font]) S.font = data.font; S.exp = {date: String(data.date || ''), n: Number.isFinite(data.version) ? data.version : 0}; S.dirty = false; S.lastBackup = DATE_RE.test(data.date) ? data.date : ''; }
  else { for (const [d, e] of Object.entries(inc)) if (!S.entries[d] || isEmpty(S.entries[d]) || e.u > S.entries[d].u) S.entries[d] = e; S.dirty = true; }
  sessionPw = pw; $('#dname').value = S.name; pos = pages().indexOf(todayS()); saveNow(); paint(); toast((mode === 'merge' ? 'Merged ' : 'Opened ') + n + (n === 1 ? ' entry' : ' entries'));
}
$('#btnSave').onclick = doSave;
$('#btnOpen').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; openFile(f); };
$('#btnPw').onclick = async () => { if (!needCrypto()) return; const pw = await askPassword(true); if (pw) { sessionPw = pw; chip(); toast('Password set. Your next backup will use it.'); } };
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files[0]; if (f && /\.txt$|text\/plain/.test(f.name + f.type)) openFile(f); });
$('#newBtn').onclick = async () => {
  if (Object.values(S.entries).some(e => !isEmpty(e))) {
    const btns = S.dirty ? [{label: 'Cancel', value: 'cancel'}, {label: 'Discard & start new', value: 'discard'}, {label: 'Backup first', value: 'save', primary: true}] : [{label: 'Cancel', value: 'cancel'}, {label: 'Start new diary', value: 'discard', primary: true}];
    const r = await modal({title: 'Start a new diary?', text: S.dirty ? 'You have entries that aren’t in a backup yet. Starting new clears this browser’s copy.' : 'Your latest backup has everything. Starting new clears this browser’s copy.', buttons: btns});
    if (r.value === 'cancel') return; if (r.value === 'save') { await doSave(); if (S.dirty) return; }
  }
  S = {name: 'My Diary', entries: {}, font: 'serif', exp: {date: '', n: 0}, dirty: false, lastBackup: ''}; sessionPw = null; $('#dname').value = S.name; pos = 0; saveNow(); paint();
};

/* ---------- boot ---------- */
(async () => {
  const st = await store.load();
  if (st && st.entries) { S = {name: String(st.name || 'My Diary').slice(0, 60), entries: sanitize(st.entries), font: FONTS[st.font] ? st.font : 'serif', exp: st.exp && typeof st.exp.n === 'number' ? st.exp : {date: '', n: 0}, dirty: !!st.dirty, lastBackup: DATE_RE.test(st.lastBackup) ? st.lastBackup : ''}; }
  $('#dname').value = S.name;
  const P = pages(); pos = P.indexOf(todayS()); if (!one) pos -= pos % 2;
  paint();
  window.__diary = {get S() { return S; }, pages, get pos() { return pos; }, ready: true};
})();
})();
</script>
